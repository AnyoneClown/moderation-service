<!-- templates/dashboard.html — Main input form -->
{% extends "base.html" %}

{% block title %}{{ t.nav_dashboard }} — {{ t.site_title }}{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
  <h1 class="text-3xl font-bold mb-2">{{ t.dash_title }}</h1>
  <p class="text-gray-500 mb-8">{{ t.dash_subtitle | safe }}</p>

  <!-- ── Example message quick-fill buttons ── -->
  <div class="mb-6">
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">{{ t.dash_examples_label }}</p>
    <div class="flex flex-wrap gap-2">
      <button type="button" onclick="fillExample(this)" data-text="{{ t.example_friendly_text }}"
        class="example-btn rounded-full border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-600 hover:bg-indigo-50 hover:border-indigo-300 hover:text-indigo-700 transition shadow-sm">
        {{ t.example_friendly }}
      </button>
      <button type="button" onclick="fillExample(this)" data-text="{{ t.example_scam_text }}"
        class="example-btn rounded-full border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-600 hover:bg-red-50 hover:border-red-300 hover:text-red-700 transition shadow-sm">
        {{ t.example_scam }}
      </button>
      <button type="button" onclick="fillExample(this)" data-text="{{ t.example_toxic_text }}"
        class="example-btn rounded-full border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-600 hover:bg-orange-50 hover:border-orange-300 hover:text-orange-700 transition shadow-sm">
        {{ t.example_toxic }}
      </button>
      <button type="button" onclick="fillExample(this)" data-text="{{ t.example_phishing_text }}"
        class="example-btn rounded-full border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-600 hover:bg-amber-50 hover:border-amber-300 hover:text-amber-700 transition shadow-sm">
        {{ t.example_phishing }}
      </button>
      <button type="button" onclick="fillExample(this)" data-text="{{ t.example_spam_fraud_text }}"
        class="example-btn rounded-full border border-gray-300 bg-white px-3 py-1.5 text-xs text-gray-600 hover:bg-purple-50 hover:border-purple-300 hover:text-purple-700 transition shadow-sm">
        {{ t.example_spam_fraud }}
      </button>
    </div>
  </div>

  <form method="POST" action="/moderate" class="space-y-5">
    <!-- ── Text input ── -->
    <div>
      <label for="text" class="block text-sm font-semibold text-gray-700 mb-1">
        {{ t.label_text }} <span class="font-normal text-gray-400">{{ t.label_text_hint }}</span>
      </label>
      <textarea
        id="text"
        name="text"
        rows="6"
        maxlength="5000"
        placeholder="{{ t.placeholder_text }}"
        class="w-full rounded-lg border border-gray-300 px-4 py-3 text-sm shadow-sm
               focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition"
      ></textarea>
      <p class="mt-1 text-xs text-gray-400">{{ t.max_chars }}</p>
    </div>

    <button
      type="submit"
      class="w-full rounded-lg bg-indigo-600 px-6 py-3 text-sm font-semibold text-white
             shadow hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-300 transition"
    >
      {{ t.btn_analyse }}
    </button>
  </form>
</div>

<script>
/* ── Example button quick fill ── */
function fillExample(btn) {
  document.getElementById('text').value = btn.dataset.text;
  document.querySelectorAll('.example-btn').forEach(b => b.classList.remove('ring-2', 'ring-indigo-400'));
  btn.classList.add('ring-2', 'ring-indigo-400');
}
</script>
{% endblock %}
