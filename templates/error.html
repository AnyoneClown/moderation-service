<!-- templates/error.html — Generic error page -->
{% extends "base.html" %}

{% block title %}{{ t.error_title }} — {{ t.site_title }}{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto text-center py-20">
  <p class="text-6xl mb-4">😕</p>
  <h1 class="text-2xl font-bold mb-2">{{ t.error_title }}</h1>
  <p class="text-gray-500 mb-6">{{ message }}</p>
  <a href="/" class="rounded-lg bg-indigo-600 px-6 py-3 text-sm font-semibold text-white hover:bg-indigo-700 transition">
    {{ t.btn_back_dashboard }}
  </a>
</div>
{% endblock %}
