# ─────────────────────────────────────────────────────────────
# Docker Compose — Orchestrates the FastAPI app + PostgreSQL
# ─────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL Database ──
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moderation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moderation_pass}
      POSTGRES_DB: ${POSTGRES_DB:-moderation_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moderation_user} -d ${POSTGRES_DB:-moderation_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Web Application ──
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "8000:8000"
    # Override CMD for development (auto-reload)
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    volumes:
      # Bind-mount source for live reload during development
      - .:/app
      # Persist uploaded images
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:
  uploads:
