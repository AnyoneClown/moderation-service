services:
  - type: web
    name: moderation-service
    runtime: docker
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_SSL_MODE
        value: require
      - key: DATABASE_POOL_PRE_PING
        value: "true"
      - key: HF_API_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
